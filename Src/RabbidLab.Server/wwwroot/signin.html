<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbid Lab</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0C14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="Assets/brand.js"></script>
<link rel="stylesheet" href="Assets/console.css">
<link rel="stylesheet" href="Assets/signin.css">
<link rel="stylesheet" href="Assets/edition.css">
<script src="Assets/palette.js" defer></script>
<script src="Assets/tiles.js" defer></script>
<script src="Assets/signin.js" defer></script>
</head>
<!-- One page for setting Rabbid Lab up and for signing in after (SignIn.cs): a local account, or Active Directory. -->
<body class="auth loading">
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10.4 10.4 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
</svg>
<canvas class="tiles" aria-hidden="true"></canvas>
<main class="auth-shell">
  <section class="signin-card">
    <!-- The header: the logo and the name, as the console's top bar shows them. -->
    <header class="band">
      <svg class="band-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0B0C14"/><g fill="#F2F3FA" transform="translate(10 14) scale(.9)"><rect width="11" height="40"/><path fill-rule="evenodd" d="M0 0H18A13 13 0 0 1 18 26H0ZM11 9V17H18A4 4 0 0 0 18 9Z"/><path d="M13 22H24L33 40H22Z"/></g><rect class="mark-dot" x="44" y="39" width="11" height="11" rx="1.5" fill="#FF6A45"/></svg><img class="band-mark" id="band-img" alt="" hidden>
      <h1 class="band-title"><span data-product>Rabbid Lab</span> <span class="dev-tag" aria-label="Dev build">DEV</span></h1>
      <p class="band-sub">Lab console</p>
    </header>

    <div class="card-body">
      <h2 id="heading">Sign in</h2>
      <p class="card-lead" id="lead"></p>

      <form id="local-form" novalidate>
        <div class="input"><svg><use href="#i-user"/></svg><input id="local-user" aria-label="Username" placeholder="Username" autocomplete="username" spellcheck="false"></div>
        <div class="input"><svg><use href="#i-lock"/></svg><input id="local-password" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password"><button type="button" class="end" data-reveal="local-password" aria-label="Show password"><svg class="eye-open"><use href="#i-eye"/></svg><svg class="eye-shut"><use href="#i-eye-off"/></svg></button></div>
        <p class="caps" id="local-password-caps" hidden>Caps Lock is on</p>
        <div class="input" id="confirm-row" hidden><svg><use href="#i-lock"/></svg><input id="local-confirm" type="password" aria-label="Confirm password" placeholder="Confirm password" autocomplete="new-password"><button type="button" class="end" data-reveal="local-confirm" aria-label="Show password"><svg class="eye-open"><use href="#i-eye"/></svg><svg class="eye-shut"><use href="#i-eye-off"/></svg></button></div>
        <p class="caps" id="local-confirm-caps" hidden>Caps Lock is on</p>
        <label class="remember" data-signed-in><input type="checkbox" id="local-remember"> Keep me signed in</label>
        <button class="go" type="submit" id="local-go">Sign in</button>
      </form>

      <form id="ad-form" novalidate hidden>
        <!-- Signing in: the domain and the controller it goes through on one line; Change opens the list of controllers. -->
        <div class="context" id="ad-context" hidden><svg><use href="#i-globe"/></svg><b id="ad-context-domain"></b><span class="sep">·</span><span class="dc unknown" id="ad-context-dc">Automatic</span><button type="button" class="change" id="ad-change" aria-controls="ad-where" aria-expanded="false">Change</button></div>
        <p class="section" data-setup>Domain</p>
        <!-- Signing in, Change opens these two: the domains it may sign in from, and their controllers. -->
        <div id="ad-where">
          <div class="combo">
            <div class="input"><svg><use href="#i-globe"/></svg><input id="ad-domain" role="combobox" aria-label="Domain" aria-expanded="false" aria-controls="domain-list" aria-autocomplete="list" placeholder="Domain, such as home.lan" autocomplete="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore><button type="button" class="end" id="domain-open" tabindex="-1" aria-label="Show domains"><svg><use href="#i-down"/></svg></button></div>
            <ul class="combo-list" id="domain-list" role="listbox" hidden></ul>
          </div>
          <div class="combo" id="server-combo">
            <div class="input server"><svg><use href="#i-server"/></svg><input id="ad-server" role="combobox" aria-label="Domain controller" aria-expanded="false" aria-controls="server-list" readonly value="Automatic" data-1p-ignore data-lpignore="true" data-bwignore><span class="now" id="server-now" hidden></span><button type="button" class="end" id="server-open" tabindex="-1" aria-label="Show domain controllers"><svg><use href="#i-down"/></svg></button></div>
            <ul class="combo-list" id="server-list" role="listbox" hidden></ul>
          </div>
        </div>
        <p class="section" data-setup>Your domain account</p>
        <div class="input"><svg><use href="#i-user"/></svg><input id="ad-user" aria-label="Username" placeholder="Username" autocomplete="username" spellcheck="false"></div>
        <div class="input"><svg><use href="#i-lock"/></svg><input id="ad-password" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password"><button type="button" class="end" data-reveal="ad-password" aria-label="Show password"><svg class="eye-open"><use href="#i-eye"/></svg><svg class="eye-shut"><use href="#i-eye-off"/></svg></button></div>
        <p class="caps" id="ad-password-caps" hidden>Caps Lock is on</p>
        <label class="remember" data-signed-in><input type="checkbox" id="ad-remember"> Keep me signed in</label>
        <button class="go" type="submit" id="ad-go">Sign in</button>
      </form>

      <p class="auth-error" id="error" role="alert" hidden></p>
      <button type="button" class="other-kind" id="other-kind"></button>
    </div>

    <!-- Where updating stands (signin.js asks /api/update/watch), and this computer and the version. -->
    <footer class="card-foot">
      <div class="foot-update">
        <p class="update" id="update" hidden><span id="update-text"></span><button type="button" id="update-check" hidden>Check for updates</button><button type="button" id="update-install" hidden>Install now</button></p>
        <div class="update-bar" id="update-bar" hidden><i id="update-fill"></i></div>
      </div>
      <p class="where" data-version></p>
    </footer>
  </section>
</main>
</body>
</html>
