<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbid Lab</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0C14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="Assets/brand.js"></script>
<script src="Assets/theme.js"></script>
<link rel="stylesheet" href="Assets/console.css">
<link rel="stylesheet" href="Assets/signin.css">
<link rel="stylesheet" href="Assets/edition.css">
<link rel="stylesheet" href="Assets/themes.css">
<link rel="stylesheet" href="Assets/theme-fixes.css">
<script src="Assets/palette.js" defer></script>
<script src="Assets/backdrop.js" defer></script>
<script src="Assets/signin.js" defer></script>
<script src="Assets/tips.js" defer></script>
</head>
<!-- One page for setting Rabbid Lab up and for signing in after (SignIn.cs): a local account, or Active Directory. -->
<body class="auth loading">
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10.4 10.4 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
</svg>
<canvas class="backdrop" aria-hidden="true"></canvas>
<main class="auth-shell">
  <section class="signin-card">
    <!-- The left side: this computer's time and date on a plain panel, a bar for how much of the day has gone, and the lab's
         name at the foot. -->
    <aside class="side" id="side">
      <div class="side-clock" aria-hidden="true">
        <b class="side-time" id="side-time"></b>
        <span class="side-date" id="side-date"></span>
        <div class="side-day"><i id="side-day-fill"></i></div>
        <span class="side-day-text" id="side-day-text"></span>
      </div>
      <div class="side-name">
        <p class="side-tag" id="side-tag" hidden></p>
        <h1 class="side-title"><span data-product data-brand-name>Rabbid Lab</span> <span class="dev-tag" aria-label="Dev build">DEV</span></h1>
        <p class="side-sub" id="side-sub">Lab console</p>
      </div>
    </aside>
    <script src="Assets/brand-paint.js"></script>

    <div class="card-body">
      <!-- Who is signing in: a ringed avatar that takes the initials of the username as it's typed, over the heading. -->
      <span class="hello-av" id="hello-av" aria-hidden="true"><svg><use href="#i-user"/></svg><b id="hello-initials"></b></span>
      <h2 id="heading">Welcome back</h2>
      <p class="card-lead" id="lead"></p>
      <p class="auth-note" id="idle-note" role="status" hidden></p>
      <p class="auth-error plain-note" id="plain-note" role="alert" hidden></p>

      <form id="local-form" novalidate>
        <label class="fld" for="local-user">Username</label>
        <div class="input"><svg><use href="#i-user"/></svg><input id="local-user" placeholder="Your username" autocomplete="username" spellcheck="false"></div>
        <label class="fld" for="local-password">Password</label>
        <div class="input"><svg><use href="#i-lock"/></svg><input id="local-password" type="password" placeholder="Your password" autocomplete="current-password"><button type="button" class="end" data-reveal="local-password" aria-label="Show password"><svg class="eye-open"><use href="#i-eye"/></svg><svg class="eye-shut"><use href="#i-eye-off"/></svg></button></div>
        <p class="caps" id="local-password-caps" hidden>Caps Lock is on</p>
        <label class="fld" for="local-confirm" id="confirm-label" hidden>Confirm password</label>
        <div class="input" id="confirm-row" hidden><svg><use href="#i-lock"/></svg><input id="local-confirm" type="password" placeholder="The same again" autocomplete="new-password"><button type="button" class="end" data-reveal="local-confirm" aria-label="Show password"><svg class="eye-open"><use href="#i-eye"/></svg><svg class="eye-shut"><use href="#i-eye-off"/></svg></button></div>
        <p class="caps" id="local-confirm-caps" hidden>Caps Lock is on</p>
        <button class="go" type="submit" id="local-go">Sign in</button>
      </form>

      <form id="ad-form" novalidate hidden>
        <!-- Setting up, or signing in after Change: the domains it may sign in from, and their controllers. -->
        <div id="ad-where">
          <label class="fld" for="ad-domain">Domain</label>
          <div class="combo">
            <div class="input"><svg><use href="#i-globe"/></svg><input id="ad-domain" role="combobox" aria-expanded="false" aria-controls="domain-list" aria-autocomplete="list" placeholder="Such as home.lan" autocomplete="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore><button type="button" class="end" id="domain-open" tabindex="-1" aria-label="Show domains"><svg><use href="#i-down"/></svg></button></div>
            <ul class="combo-list" id="domain-list" role="listbox" hidden></ul>
          </div>
          <label class="fld" for="ad-server">Domain controller</label>
          <div class="combo" id="server-combo">
            <div class="input server"><svg><use href="#i-server"/></svg><input id="ad-server" role="combobox" aria-expanded="false" aria-controls="server-list" readonly value="Automatic" data-1p-ignore data-lpignore="true" data-bwignore><span class="now" id="server-now" hidden></span><button type="button" class="end" id="server-open" tabindex="-1" aria-label="Show domain controllers"><svg><use href="#i-down"/></svg></button></div>
            <ul class="combo-list" id="server-list" role="listbox" hidden></ul>
          </div>
        </div>
        <label class="fld" for="ad-user">Username</label>
        <div class="input"><svg><use href="#i-user"/></svg><input id="ad-user" placeholder="hpotter" autocomplete="username" spellcheck="false"></div>
        <label class="fld" for="ad-password">Password</label>
        <div class="input"><svg><use href="#i-lock"/></svg><input id="ad-password" type="password" placeholder="Your password" autocomplete="current-password"><button type="button" class="end" data-reveal="ad-password" aria-label="Show password"><svg class="eye-open"><use href="#i-eye"/></svg><svg class="eye-shut"><use href="#i-eye-off"/></svg></button></div>
        <p class="caps" id="ad-password-caps" hidden>Caps Lock is on</p>
        <button class="go" type="submit" id="ad-go">Sign in</button>
        <!-- Signing in: where it signs in, under the button; Change opens the domains and controllers above. -->
        <p class="context" id="ad-context" hidden><span class="context-dot" aria-hidden="true"></span><span>Signing in to <b id="ad-context-domain"></b> through <span class="dc unknown" id="ad-context-dc">Automatic</span></span><span class="sep">·</span><button type="button" class="change" id="ad-change" aria-controls="ad-where" aria-expanded="false">Change</button></p>
      </form>

      <!-- After a right password, for an account with MFA: the code from its authenticator app. A role that requires MFA
           sets it up here first, from the QR code. -->
      <form id="mfa-form" novalidate hidden>
        <label class="fld" for="mfa-reset" id="mfa-reset-label" hidden>One-time code from whoever reset your MFA</label>
        <div class="input" id="mfa-reset-box" hidden><svg><use href="#i-user"/></svg><input id="mfa-reset" maxlength="20" placeholder="Like K7QX-M2PD-9FHT" autocomplete="off" spellcheck="false"></div>
        <div id="mfa-setup" hidden>
          <div class="mfa-qr" id="mfa-qr"></div>
          <p class="mfa-key">Can't scan it? Type this key into the app instead:<code id="mfa-secret"></code></p>
        </div>
        <label class="fld" for="mfa-code" id="mfa-code-label">Code</label>
        <div class="input" id="mfa-code-box"><svg><use href="#i-lock"/></svg><input id="mfa-code" inputmode="numeric" maxlength="7" placeholder="6 digits from your authenticator app" autocomplete="one-time-code" spellcheck="false"></div>
        <label class="mfa-skip" id="mfa-skip-row" hidden><input type="checkbox" id="mfa-skip"><span>Skip MFA this time <small>Rabbid Lab Dev, on this computer</small></span></label>
        <button class="go" type="submit" id="mfa-go">Verify</button>
      </form>

      <p class="auth-error" id="error" role="alert" hidden></p>
      <button type="button" class="other-kind" id="other-kind"></button>
      <button type="button" class="other-kind" id="mfa-back" hidden>Back to sign-in</button>
    </div>

    <!-- One line: where updating stands (signin.js asks /api/update/watch), this computer and the version, and a refresh
         icon to check now. While an update downloads, its bar is the foot's top edge. -->
    <footer class="card-foot">
      <div class="foot-update">
        <p class="update" id="update" hidden><span id="update-text"></span><button type="button" id="update-install" hidden>Install now</button></p>
        <div class="update-bar" id="update-bar" hidden><i id="update-fill"></i></div>
      </div>
      <p class="where" data-version></p>
      <button type="button" class="foot-check" id="update-check" data-tip="Check for updates" aria-label="Check for updates" hidden><svg><use href="#i-refresh"/></svg></button>
    </footer>
  </section>
</main>
</body>
</html>
